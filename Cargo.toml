[package]
name = "crazy-chess"
version = "0.1.0"
edition = "2021"
description = "A correctness-first Rust chess engine with UCI support."
license = "MIT"
# src/bin/ holds research tools; `cargo run` (used by uci_bridge.py as a fallback)
# must still start the engine.
default-run = "crazy-chess"

[dependencies]
chess = "3.2"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"

